name: Build & publish roadworks

on:
  push:
    paths:
      - build_data.py
      - requirements.txt
      - index.html
      - assets/**
      - .github/workflows/update.yml
  schedule:
    # Every two hours at :17 (UTC). Off the hour because GitHub queues
    # on-the-hour schedules and runs them late.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed data on main
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch roadworks from gov.gg
        run: python -u build_data.py

      # Commit only when the jobs themselves change, not just the timestamp,
      # so the history shows real updates. Branches never commit.
      - name: Commit data if jobs changed
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          new = json.load(open("data/roadworks.json"))["features"]
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD:data/roadworks.json"],
                                              capture_output=True, check=True).stdout)["features"]
          except Exception:
              old = None
          open("changed", "w").write("1" if new != old else "0")
          EOF
          if [ "$(cat changed)" = "1" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/roadworks.json
            git commit -m "Update roadworks data"
            git pull --rebase origin main
            git push
          else
            echo "No change in jobs; deploying fresh timestamp only"
          fi

      - name: Stage site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/roadworks.json _site/data/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
